[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-dynamic-wallpaper"
version = "0.1.0"
description = "Offline local-video wallpaper for Windows 10/11 x64"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
build = ["pyinstaller>=6.11"]

[project.scripts]
dynamic-wallpaper = "dynamic_wallpaper.__main__:main"

[tool.setuptools.packages.find]
include = ["dynamic_wallpaper*"]
